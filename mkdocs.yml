site_name: Python con Visual Studio Code
site_description: Programación y scripting con Python para administración de sistemas y redes
site_author: Jose Aguilera

theme:
  name: mkdocs
  language: es
  navigation_depth: 3
  custom_dir: overrides

nav:
  - Inicio: index.md

  - Parte I — Scripting:
      - Gestión del sistema de archivos: parte1/capitulo1.md
      - Comandos del sistema: parte1/capitulo2.md
      - Automatización: parte1/capitulo3.md
      - Scripting avanzado: parte1/capitulo4.md

  - Parte II — Redes y APIs:
      - HTTP y APIs: parte2/capitulo5.md
      - Diagnóstico de red: parte2/capitulo6.md

  - Parte III — Proyecto final:
      - Depuración en VS Code: parte3/capitulo7.md
      - Proyecto final: parte3/capitulo8.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 2
  - attr_list

extra_css:
  - stylesheets/extra.css

